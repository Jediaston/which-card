<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>What’s Cooking? – Recipes & Grocery Checklist</title>
  <meta name="description" content="Type a dish and get its ingredients as a shopping or cooking checklist, plus favorite cuisine picks.">

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f0faf6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="What's Cooking">

  <link rel="manifest" href="./manifest.webmanifest?v=1">
  <link rel="icon" href="./icons/icon.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0faf6;
      --card: #ffffff;
      --primary: #4db6a0;
      --primary-dark: #3d9a87;
      --accent: #5ec4ae;
      --text: #1e3d36;
      --muted: #5f7d74;
      --border: #d4ebe4;
      --shadow: 0 8px 30px -10px rgba(30, 61, 54, 0.07);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .hero {
      background: linear-gradient(180deg, #e7f6f1 0%, var(--bg) 65%);
      color: var(--text);
      padding: 2.75rem 1.5rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .hero-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 2.5rem;
      text-align: left;
    }

    .hero-illustration {
      flex: 0 0 auto;
      width: 340px;
      max-width: 40%;
    }

    .hero-illustration img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 18px 40px -18px rgba(30, 61, 54, 0.28);
    }

    .hero-content {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
      flex: 1 1 auto;
      text-align: center;
    }

    @media (max-width: 780px) {
      .hero {
        padding: 2rem 1.25rem 2.25rem;
      }

      .hero-inner {
        flex-direction: column-reverse;
        gap: 1.25rem;
        text-align: center;
      }

      .hero-illustration {
        width: 100%;
        max-width: 320px;
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4.5vw, 2.6rem);
      font-weight: 600;
      margin-bottom: 0.4rem;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .subtitle {
      font-size: 1.05rem;
      margin-bottom: 1.75rem;
      font-weight: 400;
      color: var(--muted);
    }

    .search-box {
      display: flex;
      gap: 0.6rem;
      max-width: 540px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem;
      box-shadow: 0 4px 20px -6px rgba(31, 42, 36, 0.06);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 1.05rem;
      padding: 0.85rem 1.25rem;
      border-radius: 999px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
    }

    @media (max-width: 480px) {
      .search-box {
        flex-wrap: wrap;
        border-radius: 22px;
      }

      .search-box input {
        flex: 1 1 100%;
        padding: 0.7rem 1rem;
      }

      .search-box button {
        flex: 1 1 100%;
        justify-content: center;
      }
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-box button {
      background: var(--primary);
      color: #f8faf8;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .search-box button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .search-box button:active {
      transform: translateY(0);
    }

    .search-box button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .container {
      max-width: 960px;
      margin: -2rem auto 3rem;
      padding: 0 1.25rem;
      position: relative;
    }

    .status {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .status.error {
      color: #8b3a3a;
      background: #faf6f6;
      border-radius: var(--radius);
      border: 1px solid #eddede;
    }

    .results {
      display: grid;
      gap: 1.75rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px -10px rgba(31, 42, 36, 0.1);
      border-color: #b8e0d4;
    }

    .card-header {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 0;
    }

    @media (max-width: 600px) {
      .card-header {
        grid-template-columns: 1fr;
      }
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eaf8f4;
    }

    @media (max-width: 600px) {
      .card-img {
        height: 220px;
      }
    }

    .card-meta {
      padding: 1.5rem 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-meta h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: #e5f7f2;
      color: #3d9a87;
    }

    .badge.area {
      background: #e5f7f2;
      color: #3d9a87;
    }

    .badge.category {
      background: #eaf8f4;
      color: #4db6a0;
    }

    .ingredients-section {
      padding: 0 1.5rem 1.5rem;
    }

    .ingredients-section h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.85rem;
      font-weight: 600;
    }

    .ingredients-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.35rem 1rem;
      list-style: none;
    }

    .ingredients-list li {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.95rem;
      padding: 0.45rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }

    .ingredients-list li:hover {
      background: #eaf8f4;
    }

    .ingredients-list li.checked {
      opacity: 0.55;
    }

    .ingredients-list li.checked .ingredient-name,
    .ingredients-list li.checked .measure {
      text-decoration: line-through;
      color: var(--muted);
    }

    .ingredients-list input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .measure {
      font-weight: 600;
      color: var(--primary);
      min-width: 4.2rem;
      flex-shrink: 0;
    }

    .ingredient-name {
      color: var(--text);
      flex: 1;
    }

    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .checklist-header h3 {
      margin-bottom: 0;
    }

    .progress {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: #e5f7f2;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
      padding-top: 1.25rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #f8faf8;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .instructions {
      display: none;
      padding: 0 1.5rem 1.5rem;
      font-size: 0.95rem;
      color: #4a554e;
      white-space: pre-line;
      line-height: 1.7;
    }

    .instructions.open {
      display: block;
    }

    .footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .spinner {
      display: inline-block;
      width: 1.1rem;
      height: 1.1rem;
      border: 2px solid rgba(248, 250, 248, 0.35);
      border-top-color: #f8faf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      margin-bottom: 1rem;
      opacity: 0.4;
      color: var(--primary);
    }

    .empty-state h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .empty-state p {
      color: var(--muted);
    }

    .examples {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .chip {
      background: #e5f7f2;
      color: #3d9a87;
      border: 1px solid #c5e8de;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .chip:hover {
      background: #d5f0e9;
      border-color: #a8d9cb;
    }

    .browse-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .fav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      margin-top: 0.85rem;
    }

    .fav-chip {
      background: #e5f7f2;
      color: #3d9a87;
      border: 1px solid #c5e8de;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .fav-chip:hover {
      background: #d5f0e9;
      border-color: #a8d9cb;
    }

    .browse-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }

    .browse-btn:hover {
      background: #eaf8f4;
      border-color: #b8e0d4;
    }

    .browse-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .browse-panel h3 {
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .browse-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .browse-chip {
      background: #e5f7f2;
      color: #3d9a87;
      border: 1px solid #c5e8de;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .browse-chip:hover {
      background: #d5f0e9;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-content">
        <h1>What’s Cooking?</h1>
        <p class="subtitle">Type a dish → get ingredients as a checklist for shopping or cooking</p>
        <form class="search-box" id="searchForm">
        <input 
          type="text" 
          id="dishInput" 
          placeholder="e.g. Spaghetti Carbonara, Pad Thai, Tacos..." 
          autocomplete="off"
          autofocus
        >
        <button type="submit" id="searchBtn">
          <span id="btnText">Find Ingredients</span>
        </button>
      </form>
      <div class="browse-bar" id="browseBar">
        <button type="button" class="browse-btn" id="randomBtn">🎲 Random</button>
        <button type="button" class="browse-btn" id="categoriesBtn">📂 Categories</button>
        <button type="button" class="browse-btn" id="cuisinesBtn">🌍 All Cuisines</button>
      </div>
      <div class="fav-bar" id="favBar">
        <button type="button" class="fav-chip" data-cuisine="Filipino">🇵🇭 Filipino</button>
        <button type="button" class="fav-chip" data-cuisine="Thai">🇹🇭 Thai</button>
        <button type="button" class="fav-chip" data-cuisine="Italian">🇮🇹 Italian</button>

        <button type="button" class="fav-chip" data-cuisine="Taiwanese">🇹🇼 Taiwanese</button>
        <button type="button" class="fav-chip" data-cuisine="Japanese">🍣 Japanese</button>
        <button type="button" class="fav-chip" data-cuisine="Mexican">🇲🇽 Mexican</button>
        <button type="button" class="fav-chip" data-cuisine="Indian">🇮🇳 Indian</button>
        </div>
      </div>
      <div class="hero-illustration">
        <picture>
          <source srcset="./images/hero-cooking.webp" type="image/webp">
          <img src="./images/hero-cooking.jpg" alt="Two people cooking together in a kitchen, chopping vegetables and stirring a pot" width="1536" height="1024" loading="eager" fetchpriority="high">
        </picture>
      </div>
    </div>
  </header>

  <main class="container">

  <footer class="footer">
    Powered by <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a> + exotic classics · Favorites & Categories for more
  </footer>

    const LOCAL_FILIPINO = LOCAL_RECIPES.filter(m => m.strArea === 'Filipino');

    function setLoading(isLoading) {
      btn.disabled = isLoading;
      if (isLoading) {
        btnText.innerHTML = '<span class="spinner"></span> Searching...';
      } else {
        btnText.textContent = 'Find Ingredients';
      }
    }

    function showStatus(msg, isError = false) {
      statusEl.style.display = 'block';
      statusEl.className = 'status' + (isError ? ' error' : '');
      statusEl.textContent = msg;
    }

    function hideStatus() {
      statusEl.style.display = 'none';
    }

    function extractIngredients(meal) {
      const items = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
          items.push({
            name: ingredient.trim(),
            measure: (measure || '').trim() || '—'
          });
        }
      }
      return items;
    }

    function createCard(meal) {
      const ingredients = extractIngredients(meal);
      const card = document.createElement('article');
      card.className = 'card';

      const youtubeBtn = meal.strYoutube 
        ? `<a class="btn btn-primary" href="${meal.strYoutube}" target="_blank" rel="noopener">▶ Watch Video</a>` 
        : '';

      card.innerHTML = `
        <div class="card-header">
          <img class="card-img" src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy">
          <div class="card-meta">
            <h2>${meal.strMeal}</h2>
            <div class="badges">
              ${meal.strCategory ? `<span class="badge category">${meal.strCategory}</span>` : ''}
              ${meal.strArea ? `<span class="badge area">${meal.strArea}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="ingredients-section">
          <div class="checklist-header">
            <h3>Grocery / Cooking Checklist</h3>
            <span class="progress" data-progress>0 / ${ingredients.length} checked</span>
          </div>
          <ul class="ingredients-list">
            ${ingredients.map((i, idx) => `
              <li data-idx="${idx}">
                <input type="checkbox" id="ing-${meal.idMeal}-${idx}" aria-label="Check ${i.name}">
                <span class="measure">${i.measure}</span>
                <span class="ingredient-name">${i.name}</span>
              </li>
            `).join('')}
          </ul>
        </div>
        <div class="actions">
          <button class="btn btn-outline toggle-instructions">Show Instructions</button>
          <button class="btn btn-outline clear-checks">Clear Checks</button>
          ${youtubeBtn}
        </div>
        <div class="instructions">${meal.strInstructions || 'No instructions available.'}</div>
      `;

      const list = card.querySelector('.ingredients-list');
      const progressEl = card.querySelector('[data-progress]');
      const clearBtn = card.querySelector('.clear-checks');

      function updateProgress() {
        const checks = list.querySelectorAll('input[type="checkbox"]');
        const checked = [...checks].filter(c => c.checked).length;
        progressEl.textContent = `${checked} / ${checks.length} checked`;
      }

      list.querySelectorAll('li').forEach(li => {
        const checkbox = li.querySelector('input');
        const toggle = () => {
          checkbox.checked = !checkbox.checked;
          li.classList.toggle('checked', checkbox.checked);
          updateProgress();
        };
        li.addEventListener('click', (e) => {
          if (e.target !== checkbox) toggle();
        });
        checkbox.addEventListener('change', () => {
          li.classList.toggle('checked', checkbox.checked);
          updateProgress();
        });
      });

      clearBtn.addEventListener('click', () => {
        list.querySelectorAll('input[type="checkbox"]').forEach(c => {
          c.checked = false;
          c.closest('li').classList.remove('checked');
        });
        updateProgress();
      });

      const toggleBtn = card.querySelector('.toggle-instructions');
      const instructionsEl = card.querySelector('.instructions');
      toggleBtn.addEventListener('click', () => {
        const isOpen = instructionsEl.classList.toggle('open');
        toggleBtn.textContent = isOpen ? 'Hide Instructions' : 'Show Instructions';
      });

      return card;
    }

    function findLocalMatches(q) {
      const lower = q.toLowerCase();
      return LOCAL_RECIPES.filter(m =>
        m.strMeal.toLowerCase().includes(lower) ||
        lower.split(/\s+/).some(w => w.length > 2 && m.strMeal.toLowerCase().includes(w))
      );
    }

    function localByCuisine(cuisine) {
      return LOCAL_RECIPES.filter(m => m.strArea === cuisine);
    }

    async function searchDish(query) {
      const q = query.trim();
      if (!q) return;

      setLoading(true);
      hideStatus();
      resultsEl.innerHTML = '';

      try {
        const res = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        let meals = data.meals || [];

        // Merge local Filipino matches
        const localHits = findLocalMatches(q);
        const existingNames = new Set(meals.map(m => m.strMeal.toLowerCase()));
        localHits.forEach(m => {
          if (!existingNames.has(m.strMeal.toLowerCase())) meals.push(m);
        });

        if (meals.length === 0) {
          showStatus(`No recipes found for “${q}”. Try Filipino button, Categories, Cuisines, or a more common name.`);
          showEmptyState();
          return;
        }

        const lowerQ = q.toLowerCase();
        meals.sort((a, b) => {
          const aExact = a.strMeal.toLowerCase() === lowerQ ? -1 : 0;
          const bExact = b.strMeal.toLowerCase() === lowerQ ? -1 : 0;
          return aExact - bExact;
        });

        meals.forEach(meal => resultsEl.appendChild(createCard(meal)));
        showStatus(`Found ${meals.length} recipe${meals.length > 1 ? 's' : ''} for “${q}”`);
      } catch (err) {
        console.error(err);
        // Still try local on network error
        const localHits = findLocalMatches(q);
        if (localHits.length) {
          localHits.forEach(m => resultsEl.appendChild(createCard(m)));
          showStatus(`Showing local Filipino recipes for “${q}”`);
        } else {
          showStatus('Something went wrong. Please check your connection and try again.', true);
          showEmptyState();
        }
      } finally {
        setLoading(false);
      }
    }

    async function loadFilterMeals(type, value) {
      setLoading(true);
      hideStatus();
      hideBrowsePanel();
      resultsEl.innerHTML = '';
      try {
        const param = type === 'category' ? 'c' : 'a';
        const res = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?${param}=${encodeURIComponent(value)}`);
        const data = await res.json();
        if (!data.meals || data.meals.length === 0) {
          showStatus(`No meals found for ${value}.`);
          showEmptyState();
          return;
        }
        // filter returns limited info — fetch full details for the first 12
        const limited = data.meals.slice(0, 12);
        const details = await Promise.all(
          limited.map(m => fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${m.idMeal}`).then(r => r.json()))
        );
        details.forEach(d => {
          if (d.meals && d.meals[0]) resultsEl.appendChild(createCard(d.meals[0]));
        });
        showStatus(`Showing ${details.length} of ${data.meals.length} ${value} recipes`);
      } catch (err) {
        console.error(err);
        showStatus('Something went wrong loading that list.', true);
        showEmptyState();
      } finally {
        setLoading(false);
      }
    }

    async function showList(type) {
      setLoading(true);
      hideStatus();
      resultsEl.innerHTML = '';
      try {
        const endpoint = type === 'categories' ? 'c' : 'a';
        const res = await fetch(`https://www.themealdb.com/api/json/v1/1/list.php?${endpoint}=list`);
        const data = await res.json();
        const items = data.meals || [];
        const title = type === 'categories' ? 'Categories' : 'Cuisines / Areas';
        const key = type === 'categories' ? 'strCategory' : 'strArea';
        browsePanel.innerHTML = `
          <h3>${title}</h3>
          <div class="browse-grid">
            ${items.map(item => `
              <button class="browse-chip" data-type="${type === 'categories' ? 'category' : 'area'}" data-value="${item[key]}">${item[key]}</button>
            `).join('')}
          </div>
        `;
        browsePanel.style.display = 'block';
        browsePanel.querySelectorAll('.browse-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            loadFilterMeals(chip.dataset.type, chip.dataset.value);
          });
        });
      } catch (err) {
        console.error(err);
        showStatus('Could not load the list.', true);
      } finally {
        setLoading(false);
      }
    }

    async function loadRandom() {
      setLoading(true);
      hideStatus();
      hideBrowsePanel();
      resultsEl.innerHTML = '';
      try {
        const res = await fetch('https://www.themealdb.com/api/json/v1/1/random.php');
        const data = await res.json();
        if (data.meals && data.meals[0]) {
          resultsEl.appendChild(createCard(data.meals[0]));
          showStatus(`Random recipe: ${data.meals[0].strMeal}`);
        }
      } catch (err) {
        console.error(err);
        showStatus('Could not load a random recipe.', true);
        showEmptyState();
      } finally {
        setLoading(false);
      }
    }

    async function loadCuisineFavorite(cuisine) {
      setLoading(true);
      hideStatus();
      hideBrowsePanel();
      resultsEl.innerHTML = '';
      try {
        // Always show local exotic/classics first
        const locals = localByCuisine(cuisine);
        locals.forEach(m => resultsEl.appendChild(createCard(m)));
        const localNames = new Set(locals.map(m => m.strMeal.toLowerCase()));

        // Then TheMealDB area filter
        let area = cuisine;
        let meals = [];
        const res = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?a=${encodeURIComponent(area)}`);
        const data = await res.json();
        if (data.meals && data.meals.length) {
          meals = data.meals;
        } else if (cuisine === 'Indian') {
          const sres = await fetch('https://www.themealdb.com/api/json/v1/1/search.php?s=curry');
          const sdata = await sres.json();
          meals = (sdata.meals || []).filter(m => (m.strArea || '').toLowerCase().includes('india'));
          if (!meals.length) meals = sdata.meals || [];
        } else if (cuisine === 'Taiwanese') {
          const cres = await fetch('https://www.themealdb.com/api/json/v1/1/filter.php?a=Chinese');
          const cdata = await cres.json();
          meals = (cdata.meals || []).slice(0, 8);
        }

        if (meals.length) {
          const limited = meals.slice(0, 10);
          const details = await Promise.all(
            limited.map(m => fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${m.idMeal}`).then(r => r.json()))
          );
          details.forEach(d => {
            if (d.meals && d.meals[0] && !localNames.has(d.meals[0].strMeal.toLowerCase())) {
              resultsEl.appendChild(createCard(d.meals[0]));
            }
          });
        }

        const count = resultsEl.querySelectorAll('.card').length;
        if (count === 0) {
          showStatus(`No recipes found for ${cuisine}. Try searching a dish name.`);
          showEmptyState();
        } else {
          showStatus(`${cuisine} recipes (${count}) — including exotic classics`);
        }
      } catch (err) {
        console.error(err);
        const locals = localByCuisine(cuisine);
        if (locals.length) {
          locals.forEach(m => resultsEl.appendChild(createCard(m)));
          showStatus(`Showing local ${cuisine} classics`);
        } else {
          showStatus(`Could not load ${cuisine} recipes.`, true);
          showEmptyState();
        }
      } finally {
        setLoading(false);
      }
    }

    randomBtn.addEventListener('click', loadRandom);
    categoriesBtn.addEventListener('click', () => showList('categories'));
    cuisinesBtn.addEventListener('click', () => showList('cuisines'));
    favBar.querySelectorAll('.fav-chip').forEach(chip => {
      chip.addEventListener('click', () => loadCuisineFavorite(chip.dataset.cuisine));
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      hideBrowsePanel();
      searchDish(input.value);
    });

    // Initial empty state
    showEmptyState();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          location.reload();
        });
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update().catch(() => {});
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
