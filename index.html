<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Which Card" />
    <title>Which Card</title>
    <meta name="description" content="Which card to swipe. Perks, not balances." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="top">
        <p class="eyebrow">Swipe picker</p>
        <h1>Which Card</h1>
      </header>

      <nav class="tabs" aria-label="Primary">
        <button type="button" data-tab="pay" class="tab is-on">Pay</button>
        <button type="button" data-tab="cards" class="tab">Cards</button>
        <button type="button" data-tab="help" class="tab">Help</button>
      </nav>

      <main>
        <section id="view-pay" class="view is-on"></section>
        <section id="view-cards" class="view" hidden></section>
        <section id="view-help" class="view" hidden></section>
      </main>
    </div>

    <div id="setup" class="setup" hidden></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
