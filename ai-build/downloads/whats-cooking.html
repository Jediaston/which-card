<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Cooking?</title>
<style>
  :root{ --bg:#f0faf6; --accent:#3D9A87; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20242B}
  .card{max-width:380px;width:100%;margin:24px;background:#fff;border-radius:20px;padding:36px 28px;
        text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.18)}
  img{width:72px;height:72px;border-radius:16px;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 8px;font-weight:650}
  p{color:#666C74;font-size:14.5px;margin:0 0 26px;line-height:1.5}
  a.open{display:inline-block;width:100%;background:var(--accent);color:#fff;text-decoration:none;
         font-weight:600;padding:14px 20px;border-radius:12px;font-size:16px;box-sizing:border-box}
  a.open:active{opacity:.85}
  .hub{display:block;margin-top:16px;font-size:13px;color:#8B9096;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <img src="https://jediaston.github.io/which-card/whats-cooking/icons/icon-192.png" alt="">
    <h1>What's Cooking?</h1>
    <p>Type a dish, get its ingredients as a shopping or cooking checklist.</p>
    <a class="open" href="https://jediaston.github.io/which-card/whats-cooking/">Open App →</a>
    <a class="hub" href="https://jediaston.github.io/which-card/ai-build/">← Back to AI Build</a>
  </div>
</body>
</html>
